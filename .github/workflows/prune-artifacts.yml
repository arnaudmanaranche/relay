name: prune-artifacts

on:
  push:
    branches: [main]

jobs:
  prune:
    # Skip commits made by this job itself, otherwise the push it makes
    # would retrigger the workflow indefinitely.
    if: "!contains(github.event.head_commit.message, '[prune-artifacts]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Prune per-feature scratch artifacts
        id: prune
        run: |
          ./skills/relay-pipeline/scripts/prune-artifacts.sh
      - name: Commit pruned files
        run: |
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: prune per-feature scratch artifacts [prune-artifacts]"
          git push
