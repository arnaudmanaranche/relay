name: prune-artifacts

on:
  schedule:
    # Weekly; feature folders only qualify once untouched for 90+ days, so
    # there's no benefit to running more often.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore feature folder mtimes from git history
        # `--archive-older-than` reads filesystem mtimes, but checkout resets
        # every file to the checkout time — without this, nothing ever looks
        # old enough to archive.
        run: |
          for dir in .ai/artifacts/features/*/; do
            [ -d "$dir" ] || continue
            ts="$(git log -1 --format=%ct -- "$dir")"
            [ -n "$ts" ] && touch -d "@$ts" "$dir"
          done
      - name: Archive feature folders untouched for 90+ days
        run: .ai/scripts/prune-artifacts.sh --archive-older-than 90
      - name: Commit archive
        run: |
          git add -A .ai/archive .ai/artifacts/features
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(relay): archive stale feature folders"
          git push
