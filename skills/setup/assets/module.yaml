code: relay
name: 'Relay'
description: 'Multi-agent feature development pipeline'
module_version: 1.5.0
default_selected: true
module_greeting: >
  Welcome to the Relay! Let's configure it for your project.

project_name:
  prompt: 'What is your project name?'
  default: 'My Project'

# Mobile-only — SKILL.md skips this prompt entirely (writes "") when
# detect-stack.mjs's project_type signal comes back "web".
app_id:
  prompt: 'What is your app bundle ID?'
  default: 'com.example.app'

# Mobile-only — the ios.* section powers the opt-in --upload-build pipeline
# stage (archive → export → upload → optional TestFlight via the asc CLI).
# All five fields can stay empty; --upload-build fails fast with an
# actionable message when it runs without them.
ios_scheme:
  prompt: 'Which Xcode scheme should be archived for App Store uploads? (leave blank to skip iOS build upload support)'
  default: ''

ios_workspace:
  prompt: 'Path to your .xcworkspace, relative to the repo root? (leave blank if you archive from a bare .xcodeproj)'
  default: ''

ios_project:
  prompt: 'Path to your .xcodeproj, relative to the repo root? (leave blank if you archive from a workspace)'
  default: ''

ios_configuration:
  prompt: 'Build configuration for release archives?'
  default: 'Release'

ios_testflight_group:
  prompt: 'TestFlight group to distribute to after upload — name or ID? (blank = upload only, no TestFlight step)'
  default: ''

github_repo:
  prompt: 'What is your GitHub repository (org/repo)?'
  default: 'org/repo'

package_manager:
  prompt: 'Which package manager do you use?'
  default: 'npm'

install_cmd:
  prompt: 'Command to install dependencies in a fresh worktree (leave default unless your project needs something other than a plain install, e.g. --frozen-lockfile)?'
  default: '{package_manager} install'

run_script:
  prompt: 'How do you run TypeScript scripts? (must be a full runnable command, e.g. "npx tsx", "pnpm exec tsx", "ts-node")'
  default: 'npx tsx'

typecheck_cmd:
  prompt: 'What is your typecheck command?'
  default: 'tsc --noEmit'

lint_cmd:
  prompt: 'What is your lint command?'
  default: 'eslint .'

lint_fix_cmd:
  prompt: 'What is your auto-fixing lint command? (leave blank to skip — run before every Dev quality gate so mechanical lint nits never cost a Dev retry)'
  default: 'eslint . --fix'

test_cmd:
  prompt: 'What command runs your test suite? (leave blank to skip — the Dev quality gate only runs this if set)'
  default: ''

format_cmd:
  prompt: 'What is your format check command?'
  default: 'prettier --check .'

format_write_cmd:
  prompt: 'What is your format write command?'
  default: 'prettier --write .'

schema_files:
  prompt: 'Which files describe your database schema? (comma-separated; a declarative schema, generated DB types, or a `dir/*.sql` migration glob. Leave blank if the project has no database — their contents are injected into the Architect and Dev prompts, which cannot read the repo themselves)'
  default: ''

default_branch:
  prompt: 'What is your default git branch name?'
  default: 'main'

branch_prefix:
  prompt: 'What prefix do you use for feature branches?'
  default: 'feat'

locales:
  prompt: 'Which locales do you support? (comma-separated)'
  default: 'en'

locale_dir:
  prompt: 'Where are your locale files?'
  default: 'i18n/locales'

analytics_provider:
  prompt: 'What analytics provider do you use?'
  default: ''

paywall_provider:
  prompt: 'What paywall provider do you use?'
  default: ''

backend_service:
  prompt: 'What backend/database service do you use?'
  default: ''

error_tracking:
  prompt: 'What error tracking service do you use?'
  default: ''

e2e_framework:
  prompt: 'What E2E testing framework do you use?'
  default: ''

e2e_dir:
  prompt: 'Where are your E2E tests?'
  default: 'e2e'
source_extensions:
  prompt: 'Which source file extensions should be indexed? (comma-separated, e.g. .ts,.tsx,.js,.jsx)'
  default: '.ts,.tsx,.js,.jsx'

skip_dirs:
  prompt: 'Which directories should be excluded from file tree and context indexing? (comma-separated)'
  default: 'node_modules,dist,build'

memory_compact_every:
  prompt: 'How many shipped features between automatic project-memory.md compaction runs?'
  default: '10'

max_tokens_per_feature:
  prompt: 'Max cumulative OpenRouter tokens per feature before the pipeline refuses further calls? (0 = unlimited)'
  default: '0'
